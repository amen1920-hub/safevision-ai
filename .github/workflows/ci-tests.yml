name: CI - lint et tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (flake8, black, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bibliotheque systeme pour OpenCV
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Installer PyTorch (CPU) et les dependances
        run: |
          pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 backend src

      - name: Format (black)
        run: black --check backend src

      - name: Tests (pytest)
        working-directory: backend
        run: pytest tests -v

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Build
        run: npm run build
